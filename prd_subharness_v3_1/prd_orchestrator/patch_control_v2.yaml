patch_control_v2:
  version: "3.1"
  purpose: "统一 natural language / YAML / Figma diff / prototype runtime / DRD projection 的 patch 候选、review、路由和落盘规则。"

  source_channels:
    natural_language:
      description: "用户或 PM 编写的 change_request.md。"
      allowed_entrypoints:
        - "prd_orchestrator/change_requests/*.md"
    structured_yaml:
      description: "由 owner harness 产生的结构化事实变更。"
      allowed_entrypoints:
        - "product-spec/*.yaml"
    figma_diff:
      description: "Figma 侧修改提取出的 semantic diff。"
      allowed_entrypoints:
        - "prd_orchestrator/figma_diff_reports/*.yaml"
      must_generate_candidate: true
      direct_fact_write_allowed: false
    prototype_runtime:
      description: "prototype.runtime.json 的生成或校验结果。"
      direct_fact_write_allowed: false
    prototype_artifact_generator:
      description: "Prototype harness v3.1 从 inputs/PRD.md 生成 source brief、DRD artifacts、runtime candidate 和 render payload 的隔离 run 输出。"
      allowed_entrypoints:
        - "runs/<run-id>/io/output/prototype_source_brief.yaml"
        - "runs/<run-id>/io/output/prototype.runtime.candidate.json"
        - "runs/<run-id>/io/output/prototype-render-payload.yaml"
        - "runs/<run-id>/prd_orchestrator/prototype_projection_reports/prototype_projection_report.yaml"
        - "runs/<run-id>/prd_orchestrator/prototype_projection_reports/prototype_projection_report.md"
      direct_fact_write_allowed: false
      forbidden_as_fact_source: true
      figma_write_allowed: false
    prototype_renderer_projection:
      description: "UX writer、layout route、Figma comments、visual lines、renderer skill influence 等原型渲染阶段产物。"
      direct_fact_write_allowed: false
    drd_deductive_projection:
      description: "DRD v3.1 screen role obligations、design kernel、logic sidecar、anchor badge 等演绎投射校验证据。"
      allowed_entrypoints:
        - "runs/<run-id>/io/output/screen_role_obligations.yaml"
        - "runs/<run-id>/io/output/design_kernel.yaml"
        - "runs/<run-id>/io/output/logic_sidecar_card_map.yaml"
      direct_fact_write_allowed: false
      forbidden_as_fact_source: true
    drd_local_materialization_patch:
      description: "DRD v3.1 对 board/page shards、sidecar cards、annotation stubs、hotspots 和 badges 的局部投射层修补。"
      allowed_entrypoints:
        - "runs/<run-id>/io/output/local_materialization_patch.yaml"
      must_generate_candidate: true
      direct_fact_write_allowed: false
      forbidden_as_fact_source: true
    design_system_adapter:
      description: "SDS monochrome adapter 等设计系统绑定配置，仅用于投射和组件绑定校验。"
      allowed_entrypoints:
        - "sub_harnesses/prototype_projection_harness/adapters/design_systems/sds_monochrome_adapter.yaml"
      direct_fact_write_allowed: false
    generated_projection:
      description: "PRD.md、最终 Figma 原型画布、Flow Map、Interaction Spec 等投影。Figma 只允许承载最终原型写入，不承载 gate/review/stop-line 结果。"
      forbidden_as_fact_source: true
    patch_report:
      description: "每次 patch 或修复的原因、改动、验证、剩余缺口和关联 stop-the-line 记录；YAML 为机器源，同名 MD 为人工阅读入口。"
      allowed_entrypoints:
        - "runs/<run-id>/prd_orchestrator/patch_reports/*.patch_report.yaml"
        - "runs/<run-id>/prd_orchestrator/patch_reports/*.patch_report.md"
      direct_fact_write_allowed: false
      fact_patch_allowed: false
    stop_the_line:
      description: "关键断点的阻断报告，记录 required_next_action 和 resume_condition；YAML 为机器源，同名 MD 为人工阅读入口。"
      allowed_entrypoints:
        - "runs/<run-id>/prd_orchestrator/stop_the_line/*.stop_the_line.yaml"
        - "runs/<run-id>/prd_orchestrator/stop_the_line/*.stop_the_line.md"
      direct_fact_write_allowed: false
      fact_patch_allowed: false
    loop_gate:
      description: "Loop v3.1 gate-only 审计、分类、路由、repair plan 和人工解释证据；只写 isolated run root，不执行 patch、rerun、payload 生成或 Figma 写入。"
      allowed_entrypoints:
        - "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/loop_finding.yaml"
        - "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/repair_plan.yaml"
        - "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/loop_manifest.yaml"
        - "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/final_loop_report.md"
      direct_fact_write_allowed: false
      fact_patch_allowed: false
      automatic_patch_apply_allowed: false
      automatic_rerun_allowed: false

  authority_boundaries:
    fact_stores:
      - path: "product-spec/requirements.yaml"
        owner: "requirement_harness"
      - path: "product-spec/screens.yaml"
        owner: "screen_state_harness"
      - path: "product-spec/metrics.yaml"
        owner: "metrics_events_harness"
      - path: "product-spec/events.yaml"
        owner: "metrics_events_harness"
    projections:
      - path: "product-spec/PRD.md"
        owner: "projection_sync_harness"
        forbidden_as_fact_source: true
      - path: "product-spec/prototype.runtime.json"
        owner: "prototype_projection_harness"
        forbidden_as_fact_source: true
      - path: "product-spec/prototype.runtime.base.json"
        owner: "prototype_projection_harness"
        forbidden_as_fact_source: true
      - path: "product-spec/figma-sync-map.yaml"
        owner: "prototype_projection_harness"
        forbidden_as_fact_source: true
      - path: "product-spec/figma-interaction-map.yaml"
        owner: "prototype_projection_harness"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/io/output/screen_role_obligations.yaml"
        owner: "prototype_projection_harness"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/io/output/design_kernel.yaml"
        owner: "prototype_projection_harness"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/io/output/logic_sidecar_card_map.yaml"
        owner: "prototype_projection_harness"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/io/output/local_materialization_patch.yaml"
        owner: "prototype_projection_harness"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/io/output/prototype_source_brief.yaml"
        owner: "prototype_projection_harness"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/io/output/prototype.runtime.candidate.json"
        owner: "prototype_projection_harness"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/io/output/prototype-render-payload.yaml"
        owner: "prototype_projection_harness"
        allowed_only_after: "generate-prototype-artifacts"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/prd_orchestrator/patch_reports/*.patch_report.yaml"
        owner: "prd_orchestrator"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/prd_orchestrator/patch_reports/*.patch_report.md"
        owner: "prd_orchestrator"
        human_readable_companion_for: "runs/<run-id>/prd_orchestrator/patch_reports/*.patch_report.yaml"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/prd_orchestrator/stop_the_line/*.stop_the_line.yaml"
        owner: "prd_orchestrator"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/prd_orchestrator/stop_the_line/*.stop_the_line.md"
        owner: "prd_orchestrator"
        human_readable_companion_for: "runs/<run-id>/prd_orchestrator/stop_the_line/*.stop_the_line.yaml"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/loop_finding.yaml"
        owner: "prd_orchestrator"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/repair_plan.yaml"
        owner: "prd_orchestrator"
        forbidden_as_fact_source: true
        automatic_patch_apply_allowed: false
        automatic_rerun_allowed: false
      - path: "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/loop_manifest.yaml"
        owner: "prd_orchestrator"
        forbidden_as_fact_source: true
      - path: "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/final_loop_report.md"
        owner: "prd_orchestrator"
        human_readable_companion_for: "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/*.yaml"
        forbidden_as_fact_source: true
      - path: "Figma final prototype canvas"
        owner: "prototype_projection_harness"
        allowed_only_after: "validate-render-readiness PASS"
        forbidden_for:
          - "validator_report"
          - "review_report"
          - "patch_report"
          - "stop_the_line"
          - "run_status_dashboard"
        forbidden_as_fact_source: true

  figma_diff_classification:
    visual_only:
      examples:
        - "坐标、间距、字号、颜色、对齐方式变化"
        - "非语义 layer rename"
      action: "keep_in_figma_only"
      fact_patch_allowed: false
    semantic_candidate:
      examples:
        - "按钮文案、错误提示、空状态文案变化"
        - "跳转目标变化"
        - "新增 modal / toast / page state"
        - "新增或删除 analytics event 标注"
      action: "generate_change_patch_candidate"
      human_review_required: true
    high_risk_candidate:
      examples:
        - "删除 P0/P1 主路径"
        - "删除关键页面或恢复路径"
        - "改变支付、权限、登录等关键流程的 guard 或 action chain"
      action: "generate_candidate_and_block_auto_apply"
      human_review_required: true
    ignored_generated_noise:
      examples:
        - "runtime_hash 变化但 semantic id 未变化"
        - "自动生成 annotation card 的位置微调"
      action: "ignore_or_record_only"
      fact_patch_allowed: false

  three_way_diff:
    required: true
    base: "last_projected_runtime_snapshot"
    left: "current_figma_semantic_extract"
    right: "current_prd_runtime_regeneration"
    conflict_rule: "same_semantic_field_changed_both_sides_requires_review"

  review_policy:
    llm_can_create_candidate: true
    llm_can_approve_patch: false
    validator_can_block: true
    human_review_required_for:
      - "source_channel == figma_diff"
      - "classification in [semantic_candidate, high_risk_candidate, conflict]"
      - "target_document in fact_stores"
      - "delete_item"
      - "same_semantic_field_changed_both_sides"
      - "source_channel in [drd_local_materialization_patch, design_system_adapter]"
      - "source_channel == prototype_artifact_generator"
      - "source_channel in [patch_report, stop_the_line]"
      - "source_channel == loop_gate"

  write_policy:
    prototype_projection_harness:
      allowed_writes:
        - "product-spec/prototype.runtime.json"
        - "product-spec/prototype.runtime.base.json"
        - "product-spec/figma-sync-map.yaml"
        - "product-spec/figma-interaction-map.yaml"
        - "prd_orchestrator/figma_diff_reports/*.yaml"
        - "prd_orchestrator/prototype_projection_reports/*.yaml"
        - "prd_orchestrator/change_patch_candidates/*.candidate.yaml"
        - "prd_orchestrator/prototype_projection_reports/*drd*.yaml"
        - "prd_orchestrator/change_patch_candidates/*drd*.candidate.yaml"
      forbidden_direct_writes:
        - "product-spec/requirements.yaml"
        - "product-spec/screens.yaml"
        - "product-spec/metrics.yaml"
        - "product-spec/events.yaml"
        - "product-spec/PRD.md"

  done_means:
    forward_projection:
      - "prototype.runtime.json generated or validated"
      - "prototype.runtime.base.json generated or validated"
      - "reasoning_completion lineage is recorded"
      - "UX writer, layout, comments, reactions and visual line validations passed or gaps recorded"
      - "figma-sync-map.yaml updated"
      - "figma-interaction-map.yaml updated"
      - "projection report generated"
      - "validators passed or gaps recorded"
    drd_validation:
      - "DRD rule package validates"
      - "screen_role_obligations validates"
      - "design_kernel validates"
      - "logic_sidecar_card_map validates"
      - "local_materialization_patch validates with writes_prd=false"
      - "SDS monochrome adapter validates or gap is recorded"
      - "patch_report records fixes when validation behavior changes"
      - "patch_report has a same-stem Markdown companion for human review"
      - "stop_the_line report exists for unresolved blocker gates"
      - "stop_the_line has a same-stem Markdown companion for human review"
      - "Figma is used only for final prototype canvas writes after render readiness passes"
    loop_gate_only:
      - "loop_v3_1 original package is archived"
      - "harness-aligned stage contracts use current DRD artifact names"
      - "loop finding, repair plan, manifest, and local patch schemas validate"
      - "repair_plan.patch_set records recommendations only"
      - "writes_prd is always false"
      - "blocker and semantic_defect findings write stop_the_line YAML plus Markdown"
      - "final_loop_report.md is the human review entry"
      - "no product-spec write, prototype payload generation, rerun, patch apply, or Figma write occurs"
    prototype_artifact_generator:
      - "inputs/PRD.md is converted to prototype_source_brief without PRD harness source extraction"
      - "DRD artifacts, runtime candidate, and render payload are generated under isolated run root"
      - "prototype-render-payload.yaml validates and is not sample/example sourced"
      - "validate-render-readiness passes before any final Figma writer may run"
      - "no product-spec fact store or Figma write occurs during generation"
    reverse_sync:
      - "figma_diff_report generated"
      - "semantic diff classified"
      - "candidate patch created"
      - "owner harness routed"
      - "no direct fact write occurred"
