document_registry:
  version: "3.1"
  documents:
    - document_id: "DOC-STRUCTURED-SOURCE-BASELINE"
      path: "runs/<run-id>/prd_orchestrator/source_extraction/structured_source_baseline.yaml"
      doc_type: "source_prd_structured_extraction_baseline"
      authority_role: "reviewed_source_input_baseline"
      writable_by:
        - "prd_orchestrator"
      fact_promotion_requires_review_decision: true
      consumed_by:
        - "prd_core_harness"
        - "requirement_harness"
        - "screen_state_harness"
        - "metrics_events_harness"
        - "release_ops_harness"
        - "traceability_harness"
        - "projection_sync_harness"
        - "prototype_projection_harness"

    - document_id: "DOC-STRUCTURED-SOURCE-SLICES"
      path: "runs/<run-id>/prd_orchestrator/source_extraction/sub_harness_inputs/*.yaml"
      doc_type: "source_prd_sub_harness_input_slice"
      authority_role: "reviewed_source_input_slice"
      writable_by:
        - "prd_orchestrator"
      fact_promotion_requires_review_decision: true
      consumed_by:
        - "target_sub_harness"

    - document_id: "DOC-PRD"
      path: "product-spec/PRD.md"
      doc_type: "narrative_prd_projection"
      authority_role: "human_readable_projection"
      writable_by:
        - "projection_sync_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-REQ"
      path: "product-spec/requirements.yaml"
      doc_type: "requirements_fact_store"
      authority_role: "structured_requirement_fact_store"
      writable_by:
        - "requirement_harness"

    - document_id: "DOC-SCREENS"
      path: "product-spec/screens.yaml"
      doc_type: "screen_semantic_model"
      authority_role: "screen_fact_store"
      writable_by:
        - "screen_state_harness"

    - document_id: "DOC-METRICS"
      path: "product-spec/metrics.yaml"
      doc_type: "metric_model"
      authority_role: "metric_fact_store"
      writable_by:
        - "metrics_events_harness"

    - document_id: "DOC-EVENTS"
      path: "product-spec/events.yaml"
      doc_type: "event_model"
      authority_role: "event_fact_store"
      writable_by:
        - "metrics_events_harness"

    - document_id: "DOC-TRACE"
      path: "product-spec/traceability.md"
      doc_type: "traceability_projection"
      authority_role: "traceability_index"
      writable_by:
        - "traceability_harness"

    - document_id: "DOC-TECH"
      path: "product-spec/tech-design.md"
      doc_type: "tech_design_projection"
      authority_role: "engineering_projection"
      forbidden_as_fact_source: true

    - document_id: "DOC-TEST"
      path: "product-spec/test-plan.md"
      doc_type: "test_plan_projection"
      authority_role: "qa_projection"
      forbidden_as_fact_source: true

    - document_id: "DOC-ANALYTICS"
      path: "product-spec/analytics-spec.md"
      doc_type: "analytics_projection"
      authority_role: "analytics_projection"
      forbidden_as_fact_source: true

    - document_id: "DOC-RELEASE"
      path: "product-spec/release-plan.md"
      doc_type: "release_projection"
      authority_role: "release_projection"
      writable_by:
        - "release_ops_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-PROTO-RUNTIME"
      path: "product-spec/prototype.runtime.json"
      doc_type: "interactive_prototype_runtime_model"
      authority_role: "derived_projection_intermediate"
      writable_by:
        - "prototype_projection_harness"
      readable_by:
        - "prototype_projection_harness"
        - "traceability_harness"
      allowed_sources:
        - "product-spec/requirements.yaml"
        - "product-spec/screens.yaml"
        - "product-spec/metrics.yaml"
        - "product-spec/events.yaml"
        - "product-spec/traceability.md"
        - "product-spec/component-binding-map.yaml"
        - "product-spec/design-semantic-library.json"
      forbidden_as_fact_source: true

    - document_id: "DOC-PROTO-RUNTIME-BASE"
      path: "product-spec/prototype.runtime.base.json"
      doc_type: "base_interactive_prototype_runtime_model"
      authority_role: "direct_structured_fact_projection_intermediate"
      writable_by:
        - "prototype_projection_harness"
      readable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-UXWRITER-COPY-CATALOG"
      path: "sub_harnesses/prototype_projection_harness/examples/uxwriter-copy-catalog.sample.yaml"
      doc_type: "uxwriter_copy_projection_contract_example"
      authority_role: "derived_copy_projection_example"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-LAYOUT-ROUTE-PLAN"
      path: "sub_harnesses/prototype_projection_harness/examples/layout-route-plan.sample.yaml"
      doc_type: "layout_route_plan_contract_example"
      authority_role: "renderer_layout_projection_example"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-FIGMA-COMMENT-MAP"
      path: "sub_harnesses/prototype_projection_harness/examples/figma-comment-map.yaml"
      doc_type: "figma_comment_annotation_map_contract_example"
      authority_role: "review_annotation_projection_example"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-RENDERER-SKILL-PACK"
      path: "sub_harnesses/prototype_projection_harness/examples/renderer-skill-pack.sample.yaml"
      doc_type: "renderer_skill_pack_contract_example"
      authority_role: "advisory_renderer_influence_example"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-FIGMA-SYNC-MAP"
      path: "product-spec/figma-sync-map.yaml"
      doc_type: "figma_node_binding_map"
      authority_role: "artifact_binding_map"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-FIGMA-INTERACTION-MAP"
      path: "product-spec/figma-interaction-map.yaml"
      doc_type: "figma_reaction_binding_map"
      authority_role: "artifact_binding_map"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-COMPONENT-BINDING-MAP"
      path: "product-spec/component-binding-map.yaml"
      doc_type: "component_semantic_binding_map"
      authority_role: "semantic_adapter_controlled_config"
      writable_by:
        - "prototype_projection_harness"
      human_review_required_for_component_key_changes: true

    - document_id: "DOC-DESIGN-SEMANTIC-LIBRARY"
      path: "product-spec/design-semantic-library.json"
      doc_type: "design_semantic_library"
      authority_role: "semantic_adapter_controlled_config"
      writable_by:
        - "prototype_projection_harness"
      human_review_required_for_role_changes: true

    - document_id: "DOC-FIGMA-DIFF-REPORTS"
      path: "prd_orchestrator/figma_diff_reports"
      doc_type: "figma_diff_report_directory"
      authority_role: "reverse_sync_evidence"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-PROTOTYPE-PROJECTION-REPORTS"
      path: "prd_orchestrator/prototype_projection_reports"
      doc_type: "prototype_projection_report_directory"
      authority_role: "projection_validation_evidence"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-PATCH-REPORTS"
      path: "runs/<run-id>/prd_orchestrator/patch_reports/*.patch_report.yaml"
      doc_type: "patch_report"
      authority_role: "patch_execution_evidence"
      writable_by:
        - "prd_orchestrator"
        - "owner_sub_harness"
      fact_promotion_requires_review_decision: true
      forbidden_as_fact_source: true

    - document_id: "DOC-PATCH-REPORTS-MD"
      path: "runs/<run-id>/prd_orchestrator/patch_reports/*.patch_report.md"
      doc_type: "patch_report_markdown"
      authority_role: "human_readable_patch_execution_review"
      companion_for: "runs/<run-id>/prd_orchestrator/patch_reports/*.patch_report.yaml"
      writable_by:
        - "prd_orchestrator"
        - "owner_sub_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-STOP-THE-LINE"
      path: "runs/<run-id>/prd_orchestrator/stop_the_line/*.stop_the_line.yaml"
      doc_type: "stop_the_line_report"
      authority_role: "blocking_gate_evidence"
      writable_by:
        - "prd_orchestrator"
        - "owner_sub_harness"
      consumed_by:
        - "run-prd-loop"
        - "human_review"
      forbidden_as_fact_source: true

    - document_id: "DOC-STOP-THE-LINE-MD"
      path: "runs/<run-id>/prd_orchestrator/stop_the_line/*.stop_the_line.md"
      doc_type: "stop_the_line_markdown"
      authority_role: "human_readable_blocking_gate_review"
      companion_for: "runs/<run-id>/prd_orchestrator/stop_the_line/*.stop_the_line.yaml"
      writable_by:
        - "prd_orchestrator"
        - "owner_sub_harness"
      consumed_by:
        - "human_review"
      forbidden_as_fact_source: true

    - document_id: "DOC-LOOP-FINDING"
      path: "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/loop_finding.yaml"
      doc_type: "loop_gate_finding"
      authority_role: "gate_only_loop_evidence"
      writable_by:
        - "prd_orchestrator"
      consumed_by:
        - "human_review"
        - "stop_the_line"
      forbidden_as_fact_source: true

    - document_id: "DOC-LOOP-REPAIR-PLAN"
      path: "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/repair_plan.yaml"
      doc_type: "loop_gate_repair_plan"
      authority_role: "gate_only_repair_recommendation"
      writable_by:
        - "prd_orchestrator"
      consumed_by:
        - "human_review"
      automatic_patch_apply_allowed: false
      automatic_rerun_allowed: false
      forbidden_as_fact_source: true

    - document_id: "DOC-LOOP-MANIFEST"
      path: "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/loop_manifest.yaml"
      doc_type: "loop_gate_manifest"
      authority_role: "machine_validated_loop_gate_record"
      writable_by:
        - "prd_orchestrator"
      consumed_by:
        - "human_review"
      forbidden_as_fact_source: true

    - document_id: "DOC-FINAL-LOOP-REPORT-MD"
      path: "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/final_loop_report.md"
      doc_type: "final_loop_report_markdown"
      authority_role: "human_readable_loop_gate_review"
      companion_for: "runs/<run-id>/prd_orchestrator/loop_gates/<gate-id>/*.yaml"
      writable_by:
        - "prd_orchestrator"
      consumed_by:
        - "human_review"
      forbidden_as_fact_source: true

    - document_id: "DOC-PROTOTYPE-SOURCE-BRIEF"
      path: "runs/<run-id>/io/output/prototype_source_brief.yaml"
      doc_type: "prototype_source_brief"
      authority_role: "prototype_generator_source_slice"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-PROTOTYPE-RUNTIME-CANDIDATE"
      path: "runs/<run-id>/io/output/prototype.runtime.candidate.json"
      doc_type: "prototype_runtime_candidate"
      authority_role: "derived_projection_intermediate"
      writable_by:
        - "prototype_projection_harness"
      consumed_by:
        - "validate-render-readiness"
      forbidden_as_fact_source: true

    - document_id: "DOC-PROTOTYPE-RENDER-PAYLOAD"
      path: "runs/<run-id>/io/output/prototype-render-payload.yaml"
      doc_type: "prototype_render_payload"
      authority_role: "final_figma_writer_input_candidate"
      writable_by:
        - "prototype_projection_harness"
      consumed_by:
        - "validate-render-readiness"
        - "final_figma_writer"
      forbidden_as_fact_source: true

    - document_id: "DOC-PROTOTYPE-GENERATION-REPORT"
      path: "runs/<run-id>/prd_orchestrator/prototype_projection_reports/prototype_projection_report.yaml"
      doc_type: "prototype_generation_report"
      authority_role: "machine_validated_generation_evidence"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-PROTOTYPE-GENERATION-REPORT-MD"
      path: "runs/<run-id>/prd_orchestrator/prototype_projection_reports/prototype_projection_report.md"
      doc_type: "prototype_generation_report_markdown"
      authority_role: "human_readable_generation_review"
      companion_for: "runs/<run-id>/prd_orchestrator/prototype_projection_reports/prototype_projection_report.yaml"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-PATCH-REPORT-SCHEMA"
      path: "schemas/patch_report.schema.json"
      doc_type: "patch_report_schema"
      authority_role: "validation_schema"
      writable_by:
        - "prd_orchestrator"

    - document_id: "DOC-PATCH-REPORT-MD-TEMPLATE"
      path: "prd_orchestrator/templates/patch_report.template.md"
      doc_type: "patch_report_markdown_template"
      authority_role: "human_review_template"
      writable_by:
        - "prd_orchestrator"

    - document_id: "DOC-STOP-THE-LINE-SCHEMA"
      path: "schemas/stop_the_line.schema.json"
      doc_type: "stop_the_line_schema"
      authority_role: "validation_schema"
      writable_by:
        - "prd_orchestrator"

    - document_id: "DOC-STOP-THE-LINE-MD-TEMPLATE"
      path: "prd_orchestrator/templates/stop_the_line.template.md"
      doc_type: "stop_the_line_markdown_template"
