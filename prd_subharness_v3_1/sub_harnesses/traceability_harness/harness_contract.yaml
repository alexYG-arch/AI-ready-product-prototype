harness_contract:
  id: "traceability_harness"
  name: "Traceability Harness"
  version: "1.0"
  owns: "追踪矩阵、依赖图、影响分析、局部重跑计划、tombstone。"
  not_owns: "生成需求内容、批准产品决策。"
  required_outputs:
    - "patch_report"
    - "change_patch"
    - "impact_analysis"
  authority_boundary:
    llm_can_generate: "candidate"
    validator_can_block: true
    human_review_required_for_high_risk: true
  run_lifecycle:
    human_review_stage:
      required: true
      review_artifacts:
        - "run_manifest"
        - "candidate_outputs"
        - "validator_report"
        - "impact_analysis"
        - "review_decision"
      approval_required_before:
        - "candidate_to_confirmed"
        - "write_instance_product_spec"
        - "close_open_question"
