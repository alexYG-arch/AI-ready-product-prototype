harness_contract:
  id: "prototype_projection_harness"
  name: "Prototype Projection Harness"
  version: "3.1"
  type: "projection_harness"

  owns:
    - "prototype_runtime_model"
    - "figma_forward_projection"
    - "figma_node_map"
    - "figma_interaction_map"
    - "interaction_graph_projection"
    - "component_binding"
    - "pattern_binding"
    - "runtime_reasoning_completion"
    - "renderer_stage_plan"
    - "uxwriter_copy_projection"
    - "figma_comment_map"
    - "visual_flow_line_map"
    - "renderer_skill_influence_trace"
    - "figma_diff_ingest"
    - "prototype_projection_reports"
    - "screen_role_obligations"
    - "design_kernel"
    - "composition_plan"
    - "interaction_hotspot_map"
    - "logic_sidecar_card_map"
    - "annotation_stub_map"
    - "anchor_badge_map"
    - "local_materialization_patch"

  not_owns:
    - "confirmed_product_requirements"
    - "screen_fact_store"
    - "metric_or_event_fact_store"
    - "PRD.md narrative projection"
    - "human approval of patch"
    - "Figma design system source components"

  allowed_inputs:
    - "product-spec/requirements.yaml"
    - "product-spec/screens.yaml"
    - "product-spec/metrics.yaml"
    - "product-spec/events.yaml"
    - "product-spec/traceability.md"
    - "product-spec/component-binding-map.yaml"
    - "product-spec/design-semantic-library.json"
    - "prd_orchestrator/patch_control_v2.yaml"
    - "sub_harnesses/prototype_projection_harness/examples/prd_fact_bundle.sample.yaml"
    - "sub_harnesses/prototype_projection_harness/drd_v3_1/rules/12_complete_deductive_rules.yaml"
    - "sub_harnesses/prototype_projection_harness/drd_v3_1/profile.yaml"
    - "sub_harnesses/prototype_projection_harness/adapters/design_systems/sds_monochrome_adapter.yaml"
    - "inputs/PRD.md (generate-prototype-artifacts source only)"

  forbidden_inputs_as_fact_source:
    - "product-spec/PRD.md"
    - "Figma frame text"
    - "Figma layer name"
    - "Flow Map annotation"
    - "Interaction Spec annotation"

  allowed_outputs:
    - "product-spec/prototype.runtime.base.json"
    - "product-spec/prototype.runtime.json"
    - "product-spec/figma-sync-map.yaml"
    - "product-spec/figma-interaction-map.yaml"
    - "prd_orchestrator/prototype_projection_reports/*uxwriter*.yaml"
    - "prd_orchestrator/prototype_projection_reports/*layout*.yaml"
    - "prd_orchestrator/prototype_projection_reports/*comments*.yaml"
    - "prd_orchestrator/prototype_projection_reports/*skill*.yaml"
    - "prd_orchestrator/figma_diff_reports/*.yaml"
    - "prd_orchestrator/prototype_projection_reports/*.yaml"
    - "prd_orchestrator/change_patch_candidates/*.candidate.yaml"
    - "sub_harnesses/prototype_projection_harness/drd_v3_1/examples/*.sample.yaml"
    - "sub_harnesses/prototype_projection_harness/adapters/design_systems/sds_monochrome_adapter.yaml"
    - "runs/<run-id>/io/output/prototype_source_brief.yaml"
    - "runs/<run-id>/io/output/prototype.runtime.candidate.json"
    - "runs/<run-id>/io/output/prototype-render-payload.yaml"
    - "runs/<run-id>/io/output/screen_role_obligations.yaml"
    - "runs/<run-id>/io/output/design_kernel.yaml"
    - "runs/<run-id>/io/output/composition_plan.yaml"
    - "runs/<run-id>/io/output/interaction_hotspot_map.yaml"
    - "runs/<run-id>/io/output/logic_sidecar_card_map.yaml"
    - "runs/<run-id>/io/output/annotation_stub_map.yaml"
    - "runs/<run-id>/io/output/anchor_badge_map.yaml"
    - "runs/<run-id>/io/output/local_materialization_patch.yaml"
    - "runs/<run-id>/prd_orchestrator/prototype_projection_reports/prototype_projection_report.yaml"
    - "runs/<run-id>/prd_orchestrator/prototype_projection_reports/prototype_projection_report.md"

  forbidden_direct_writes:
    - "product-spec/requirements.yaml"
    - "product-spec/screens.yaml"
    - "product-spec/metrics.yaml"
    - "product-spec/events.yaml"
    - "product-spec/PRD.md"

  required_outputs:
    forward_projection:
      - "prototype.runtime.base.json"
      - "prototype.runtime.json"
      - "uxwriter-copy-catalog.yaml"
      - "layout_route_plan.yaml"
      - "figma-sync-map.yaml"
      - "figma-interaction-map.yaml"
      - "figma-comment-map.yaml"
      - "prototype_projection_report"
    reverse_sync:
      - "figma_diff_report"
      - "change_patch_candidate"
    drd_v3_1_validation:
      - "screen_role_obligations.yaml"
      - "design_kernel.yaml"
      - "composition_plan.yaml"
      - "interaction_hotspot_map.yaml"
      - "logic_sidecar_card_map.yaml"
      - "annotation_stub_map.yaml"
      - "anchor_badge_map.yaml"
      - "local_materialization_patch.yaml"
      - "sds_monochrome_adapter_validation"
    generator_v3_1:
      - "prototype_source_brief.yaml"
      - "prototype.runtime.candidate.json"
      - "prototype-render-payload.yaml"
      - "prototype_projection_report.yaml"

  authority_boundary:
    llm_can_generate: "candidate_or_projection"
    validator_can_block: true
    human_review_required_for_high_risk: true
    figma_diff_requires_human_review: true

  run_lifecycle:
    human_review_stage:
      required: true
      review_artifacts:
        - "product-spec/prototype.runtime.json"
        - "product-spec/figma-sync-map.yaml"
        - "product-spec/figma-interaction-map.yaml"
        - "prd_orchestrator/figma_diff_reports/*.yaml"
        - "prd_orchestrator/prototype_projection_reports/*.yaml"
        - "prd_orchestrator/change_patch_candidates/*.candidate.yaml"
      approval_required_before:
        - "writing Figma fact-change candidates into owner fact stores"
        - "accepting high-risk Figma diff candidates"
        - "deleting or tombstoning previously projected semantic ids"
        - "changing component role, binding key, or interaction destination"
        - "promoting local materialization patch into any PRD fact store"
