prototype_harness_figma_live_visual_comprehension_rules:
  id: FIGMA_LIVE_VISUAL_COMPREHENSION_RULES_V3_1_3
  id_zh: 原型 Harness Figma 真实回读、页面构成与视觉理解规则 v3.1.3
  version: "3.1.3"
  mode: DRD_MODE
  purpose_zh: >
    防止最终 Figma 画布只满足节点数量，却在人类视角不可读、不可用。
    writer 写入后不能只信任自报 audit；必须基于 Figma live readback、几何检查、
    截图清单、payload、review/canvas view model 与 PRD source_refs 的交叉校验。

  rules:
    - rule_id: SURFACE_DED_001
      name_zh: screen 承载面不得隐式覆盖 state/frame
      rule_zh: >
        screen 只表达业务页面或功能面；每个 state/frame 必须独立声明真实呈现层，
        例如 app_page、host_page、embedded_keyboard_panel、system_picker_overlay、
        modal、toast_or_inline_feedback 或 same_surface_state。
      blocks_when_zh: state/frame 没有 frame_surface，或直接继承 screen carrier 且来源不足。

    - rule_id: SURFACE_DED_002
      name_zh: frame 级承载面不一致必须写 override reason
      rule_zh: >
        当 screen carrier 与 state/frame carrier 不一致时，必须写明
        carrier_override_reason_zh，说明为什么该状态真实发生在另一个承载面。
      blocks_when_zh: screen/frame carrier 不一致但没有 override reason。

    - rule_id: SURFACE_DED_003
      name_zh: materialization 必须保留 frame 级 carrier
      rule_zh: >
        figma_prototype_materialization 中每个 state/frame 必须保留 frame_surface、
        carrier_zh 和 composition_contract。不得在写入层把 frame carrier 落成 None。
      blocks_when_zh: materialization 中 frame_surface 缺失、unknown 或 None。

    - rule_id: SURFACE_DED_004
      name_zh: Figma live readback carrier 必须与 surface hierarchy 对齐
      rule_zh: >
        writer 必须写入 semantic id / plugin data 或命名映射，使 live readback 能反查
        scene、frame、component 的 carrier。回读 carrier 与 surface_hierarchy_map 不一致时阻断。
      blocks_when_zh: live readback 缺 carrier 标签，或 carrier 标签与 surface_hierarchy_map 不一致。

    - rule_id: SCENE_DED_001
      name_zh: final Figma page 不得是状态矩阵
      rule_zh: >
        最终页只能包含 PROTOTYPE-FINAL-ENTRY、SCENE-CLUSTER:*、
        PROTOTYPE-SCENE:* 和 LIVE-AUDIT-MARKERS:*。禁止旧 SCREEN:*、
        PROTOTYPE-RUNTIME:*、状态索引板和临时 label 混入。
      blocks_when_zh: final page 中发现状态矩阵、旧 screen 分组、runtime 索引或说明板伪原型。

    - rule_id: SCENE_DED_002
      name_zh: 每个 state 必须归入 scene cluster
      rule_zh: >
        payload 中每个 state/frame 必须进入 prototype_scene_graph 的某个 scene，
        每个 scene 必须属于一个按用户任务链组织的 scene_cluster。
      blocks_when_zh: state/frame 没有 scene 或 scene 没有 cluster。

    - rule_id: SCENE_DED_003
      name_zh: 同页状态变化不能误画成跨页面流转
      rule_zh: >
        transition_kind 为 same_scene_state_change 或 inline_feedback 的交互只能作为同一
        scene cluster 内状态说明/variant-like target 表达，不能在页面流转图里画成返回初始页的导线。
      blocks_when_zh: 同页状态变化进入页面流转图。

    - rule_id: SCENE_DED_004
      name_zh: prototype starting point 必须指向真实入口 scene
      rule_zh: >
        Figma prototype 起点必须指向真实入口 scene，而不是 review board、状态索引或说明板。
      blocks_when_zh: starting point 缺失，或指向非 PROTOTYPE-SCENE 节点。

    - rule_id: UI_PRIM_DED_006
      name_zh: UI primitive 必须分 surface、region、control 三层
      rule_zh: >
        prototype_ui_blueprint 必须同时输出 surface_primitives、region_primitives、
        control_primitives，并为每个 component 写 primitive_path。
      blocks_when_zh: primitive 仍只有单层 toolbar/result_card/error_notice 等粗分类。

    - rule_id: UI_PRIM_DED_007
      name_zh: 系统选择器必须包含四区
      rule_zh: >
        系统选择器、媒体选择器、文件选择器等 handoff surface 必须包含 header、
        grid/content、action 和 feedback 四个 region。
      blocks_when_zh: system_picker_overlay 缺 picker_header、picker_grid_region、picker_action_bar 或 picker_feedback_region。

    - rule_id: UI_PRIM_DED_008
      name_zh: 输入法面板必须保留宿主面和键盘面板
      rule_zh: >
        embedded_keyboard_panel 必须同时表达 host_chat_surface 与 keyboard_ai_panel，
        不得被提升为普通独立页面或单一内容区。
      blocks_when_zh: 输入法链路缺 host surface 或 keyboard panel。

    - rule_id: UI_PRIM_DED_009
      name_zh: 结果页必须有结果结构区
      rule_zh: >
        result_surface 必须包含 result_summary_region，并按 PRD 内容生成会员差异区或下一步操作区。
      blocks_when_zh: 结果页只画结果文案，没有摘要区、会员差异区或下一步操作区。

    - rule_id: HUMAN_DED_001
      name_zh: 每个 scene 必须有人能读懂的页面说明
      rule_zh: >
        prototype_canvas_view_model 中每个 scene 必须说明页面名称、功能作用和承载面。
        Figma writer 必须把这些说明画入 interaction_explanation_region。
      blocks_when_zh: scene 缺页面说明，或 live readback 找不到对应说明文本。

    - rule_id: HUMAN_DED_002
      name_zh: 每个 state 必须有人能读懂的状态说明
      rule_zh: >
        state 不能只显示机器 ID；必须有用户能理解的当前状态说明。
      blocks_when_zh: 状态说明缺失，或包含 RELATION/TOPIC 等大量机器 ID 文本。

    - rule_id: HUMAN_DED_003
      name_zh: 每个可点击控件必须有交互说明
      rule_zh: >
        每个可点击控件必须能在当前 scene 的说明区或说明面板中找到：
        点击前条件、点击后发生什么、是否同页变化/跨 scene/系统交接/失败恢复。
      blocks_when_zh: 有 reaction 或 hotspot，但没有可读交互说明。

    - rule_id: HUMAN_DED_004
      name_zh: operation chain 必须投射成可读文字
      rule_zh: >
        operation_chain_id 不能只作为机器 ID 存在；必须展开为进入、操作、取消、
        失败、返回和最早反馈位置的中文说明。
      blocks_when_zh: operation chain 只有 ID，没有中文步骤说明。

    - rule_id: HUMAN_DED_005
      name_zh: live readback 必须能找到页面、状态、交互说明文本
      rule_zh: >
        Figma live readback 必须能从真实节点树中找到页面说明、状态说明和交互说明。
      blocks_when_zh: live readback 文本节点缺少任一说明类型。

    - rule_id: VISUAL_DED_001
      name_zh: live readback 是 post-write gate 的主证据
      rule_zh: >
        post-write gate 不得只使用 writer 自报 audit；必须读取 Figma live node tree、
        文本、bbox、reaction、semantic ids 和 source refs。
      blocks_when_zh: 缺 figma_live_readback_snapshot 或 snapshot 不是 live readback 来源。

    - rule_id: VISUAL_DED_002
      name_zh: 几何审计必须阻断出界、重叠和过密
      rule_zh: >
        figma_geometry_audit 必须检查文本/组件出界、重叠、高密度不可读画面、
        泛化文本、状态矩阵、旧 screen 分组和缺说明 hotspot。
      blocks_when_zh: 任一 blocker 几何/可读性问题存在。

    - rule_id: VISUAL_DED_003
      name_zh: 视觉语义审计必须对照 payload 和 source_refs
      rule_zh: >
        figma_visual_semantic_audit 必须把 live readback 与 prototype_canvas_view_model、
        payload 摘要、source coverage 摘要和 PRD source_refs 对照。
      blocks_when_zh: 画布节点无法追溯到 scene/payload/source_refs。

    - rule_id: VISUAL_DED_004
      name_zh: 模型视觉理解必须给出人类可读性结论
      rule_zh: >
        model_figma_visual_comprehension 必须输出 human_understandable、
        page_composition_ok、interaction_explanations_ok、carrier_alignment_ok、
        state_matrix_detected 和 source_alignment_ok。
      blocks_when_zh: 模型判断 human_understandable=false 或出现 blocker findings。

    - rule_id: VISUAL_DED_005
      name_zh: 泛化文本必须低于阈值
      rule_zh: >
        final canvas 中“结果内容”“选择或输入内容”“应用页面内容区”
        “展示可点击入口”“当前操作”等泛化占位文本不得出现于可见标题、
        控件、结果、交互说明或系统交接区域。
      blocks_when_zh: 泛化文本数量大于 0，或出现在关键操作/结果区域。

    - rule_id: VISUAL_DED_006
      name_zh: hotspot 必须可被人理解
      rule_zh: >
        每个 hotspot 附近必须有可见控件或说明引用；透明 fallback 必须记录 semantic id 和 target scene。
      blocks_when_zh: 存在没有说明、没有可见控件或没有目标的 hotspot。

    - rule_id: VISUAL_DED_007
      name_zh: live visual gate 失败必须进入 loop evidence
      rule_zh: >
        live readback、geometry、semantic 或模型视觉理解失败时，只能写 gate-only loop evidence；
        不自动 patch、不自动 rerun、不写 PRD fact store。
      blocks_when_zh: 视觉 gate 失败但仍标记最终原型通过，或缺 loop_finding/repair_plan/manifest/report。

    - rule_id: VISUAL_DED_008
      name_zh: 正常原型图不得被说明文档支配
      rule_zh: >
        最终 Figma 可见主画布必须首先像一个可体验产品原型，而不是页面组、模块板、
        规则说明板或 review 文档。页面说明、承载面说明和交互说明可以作为旁注或
        review 区存在，但不得成为产品主画面的主体，不得显示“页面组”“功能：”
        “承载面：”“操作元素”“输入选择元素”“反馈提示元素”等文档化标题来替代真实 UI。
      blocks_when_zh: >
        可见画布出现页面组标题，或文档/规则/说明类文本数量过多，导致画面虽无状态矩阵
        但仍不像正常产品原型。

  failure_memory_contract:
    source_file: prototype_failure_memory.yaml
    rule_zh: >
      live readback、geometry audit、semantic audit 和 model visual comprehension 必须读取
      prototype_failure_memory.yaml 中的历史失败模式。任何已记录失败再次出现时，
      必须作为 blocker，而不是 warning。
    enforced_memories:
      - MEM-FIGMA-001
      - MEM-FIGMA-002
      - MEM-FIGMA-003
      - MEM-FIGMA-004
      - MEM-FIGMA-005
      - MEM-FIGMA-006
      - MEM-FIGMA-007
      - MEM-FIGMA-008
