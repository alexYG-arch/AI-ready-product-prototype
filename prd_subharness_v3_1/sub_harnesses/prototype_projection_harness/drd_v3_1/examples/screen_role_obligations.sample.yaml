screen_role_obligations:
  version: "3.1"
  mode: DRD_MODE
  source_refs:
    - PRD.md#upload-image-rule
  rule_trace:
    trace_version: "3.1.1"
    projection_map_id: RULE_PROJECTION_MAP_V3_1_1
    artifact_key: screen_role_obligations
    stage_id: ROLE-01
    rule_ids: &role_rule_ids [ROLE_DED_001, ROLE_DED_002, ROLE_DED_003, ROLE_DED_004, ROLE_DED_005, ROLE_DED_006, ROLE_DED_007]
  obligations:
    - obligation_id: OBL-PICKER-SURFACE
      obligation_type: surface_obligation
      obligation_zh: 必须展示系统相册选择器或抽象占位。
      derived_from_primitives:
        action: select_and_upload
        object: images
        host_surface: system_handoff
      source_refs:
        - PRD.md#upload-image-rule
      inference_basis_zh: 选择图片通常需要系统相册或文件选择表面，不能只画业务页入口。
      display_requirement: frame_or_abstract_surface
      materialization_target: board_frame_packets
      review_status: candidate_projection
      rule_ids: *role_rule_ids
    - obligation_id: OBL-COUNT-BOUNDARY
      obligation_type: constraint_obligation
      obligation_zh: 必须展示 1、3、5、6 张边界状态。
      derived_from_primitives:
        constraints:
          - min_count: 3
          - max_count: 5
      source_refs:
        - PRD.md#upload-image-rule
      inference_basis_zh: 存在数量上下限，需要展示最小非法、最小合法、最大合法、最大非法。
      display_requirement: boundary_state_group
      materialization_target: board_frame_packets
      review_status: candidate_projection
      rule_ids: *role_rule_ids
    - obligation_id: OBL-CONFIRM-STATE
      obligation_type: control_state_obligation
      obligation_zh: 必须展示确认按钮置灰/可用状态。
      derived_from_primitives:
        commit_control: picker_confirm_button
      source_refs:
        - PRD.md#upload-image-rule
      inference_basis_zh: 数量约束会影响确认按钮是否允许继续。
      display_requirement: control_state_pair
      materialization_target: interaction_hotspot_map
      review_status: candidate_projection
      rule_ids: *role_rule_ids
    - obligation_id: OBL-BEFORE-CONFIRM-HINT
      obligation_type: feedback_obligation
      obligation_zh: 数量不足或超限必须在确认前强提醒。
      derived_from_primitives:
        feedback_timing: before_confirm
      source_refs:
        - PRD.md#upload-image-rule
      inference_basis_zh: 用户仍在选择器表面时可以修正选择数量，反馈不应延迟到返回业务页之后。
      display_requirement: annotation_stub_and_sidecar
      materialization_target: logic_sidecar_card_map
      review_status: candidate_projection
      rule_ids: *role_rule_ids
