      trigger_zh: 继续选择图片项
      guard_zh: 已选数量 = 5
      action_summary_zh: 阻止第 6 张或立即强提醒最多选择 5 张。
      feedback_timing_zh: on_select_or_before_confirm
      source_refs:
        - PRD.md#upload-image-rule
