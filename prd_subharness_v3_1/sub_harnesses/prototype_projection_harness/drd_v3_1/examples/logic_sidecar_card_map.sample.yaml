logic_sidecar_card_map:
  version: "3.1"
  mode: DRD_MODE
  board_id: BOARD-IMAGE-UPLOAD-FLOW
  board_id_zh: 图片上传使用链路画布
  cards:
    - card_id: SC-COUNT-LOW
      card_id_zh: 选择不足说明卡
      column: right_sidecar_column
      anchor_badge_id: BADGE-03
