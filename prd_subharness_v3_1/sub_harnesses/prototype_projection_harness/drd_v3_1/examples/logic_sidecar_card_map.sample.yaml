      short_summary_zh: 低于 3 张，确认置灰，见 SC-COUNT-LOW。
      source_refs:
        - PRD.md#upload-image-rule
    - annotation_id: ANN-COUNT-HIGH
      target_node_or_region: FR-PICKER-SELECT-6.image_grid
      interaction_or_state_id: STATE-PICKER-SELECT-6
      sidecar_card_id: SC-COUNT-HIGH
      short_summary_zh: 尝试第 6 张时阻止，见 SC-COUNT-HIGH。
      source_refs:
        - PRD.md#upload-image-rule
