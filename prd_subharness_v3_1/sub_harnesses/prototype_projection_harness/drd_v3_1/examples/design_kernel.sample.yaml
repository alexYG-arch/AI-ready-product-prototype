design_kernel:
  version: "3.1"
  mode: DRD_MODE
  source_refs:
    - PRD.md#upload-image-rule
  task_contract:
    task_id: TASK-IMAGE-UPLOAD-3-5
    task_name_zh: 上传 3-5 张图片
    user_goal_zh: 用户从系统相册选择合规数量的图片并返回业务页上传。
    action: select_and_upload
    object: images
    source_refs:
      - PRD.md#upload-image-rule
  surface_contract:
    surface_type: system_handoff
    surface_type_zh: 系统相册选择器
    entry_surface: app_upload_entry
    return_surface: app_upload_page
    forbidden_realizations:
      - 只画上传入口和成功/失败提示。
      - 等返回业务页后才提示选择数量不符合。
  constraint_contracts:
    - constraint_id: C-MIN-3
      constraint_zh: 至少选择 3 张
      applies_at: photo_picker_selection
      applies_at_zh: 相册选择器选择阶段
      earliest_fix_surface: photo_picker
      feedback_timing: before_confirm
      valid_condition: selected_count >= 3
      invalid_condition: selected_count < 3
    - constraint_id: C-MAX-5
      constraint_zh: 最多选择 5 张
      applies_at: photo_picker_selection
      applies_at_zh: 相册选择器选择阶段
      earliest_fix_surface: photo_picker
      feedback_timing: on_select_or_before_confirm
      valid_condition: selected_count <= 5
      invalid_condition: selected_count > 5
  control_contracts:
    - control_id: picker_confirm_button
      control_zh: 选择器确认按钮
      affected_by_constraints:
        - C-MIN-3
        - C-MAX-5
      required_states:
        - disabled_or_blocked_for_invalid
        - enabled_for_valid
  feedback_contracts:
    - feedback_id: FB-COUNT-LOW
      feedback_zh: 至少还需选择 2 张
      severity: blocking
      timing: before_confirm
      surface: photo_picker
      anchor: picker_confirm_button
    - feedback_id: FB-COUNT-HIGH
      feedback_zh: 最多只能选择 5 张
      severity: blocking
      timing: on_select_or_before_confirm
      surface: photo_picker
      anchor: selected_image_grid
  forbidden_realizations:
    - 只画上传入口和成功/失败提示。
    - 把系统选择器压成一个普通按钮结果。
