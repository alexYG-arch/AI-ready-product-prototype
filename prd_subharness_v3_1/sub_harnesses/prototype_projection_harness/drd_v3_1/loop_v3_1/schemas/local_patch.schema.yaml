schema:
  id: local_patch_schema
  id_zh: 局部修补 Schema
  type: object
  required:
    - patch_id
    - patch_type
    - source_finding_id
    - before_hash
    - operations
    - after_hash
    - writes_prd
  properties:
    patch_id:
      type: string
    patch_type:
      type: string
    source_finding_id:
      type: string
    before_hash:
      type: string
    operations:
      type: array
    after_hash:
      type: string
    writes_prd:
      type: boolean
