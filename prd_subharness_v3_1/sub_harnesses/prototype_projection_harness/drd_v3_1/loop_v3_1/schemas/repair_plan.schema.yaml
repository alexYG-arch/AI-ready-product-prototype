schema:
  id: repair_plan_schema
  id_zh: 修补计划 Schema
  type: object
  required:
    - plan_id
    - findings
    - selected_profile
    - route_targets
    - patch_set
    - rerun_scope
    - revalidate
  properties:
    plan_id:
      type: string
    findings:
      type: array
    selected_profile:
      type: string
    route_targets:
      type: array
    patch_set:
      type: array
    rerun_scope:
      type: object
    revalidate:
      type: array
