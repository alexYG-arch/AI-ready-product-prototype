validator_spec_version: '3.0'
validator_group_spec: prototype_drd_stage_grouped
review_status: approved_by_human_review
intent: 把结构化 PRD facts 安全投射为 DRD source slices、surface decisions、board/page shards、Dev
  Mode annotations、Pen logic lines 和 projection report；runtime/Figma/annotation/Pen
  line 均不得成为事实源。
validators:
  language_validators:
  - id: LANG-001
    stage: language
    severity: blocker
    natural_language: 严格 JSON 文件不得包含 // 或 /* */ 注释；需要中文注释时使用 YAML 或 JSONC 草稿。
    applies_to:
      documents: &id001
      - sub_harnesses/prototype_projection_harness/drd/rules/00_language_and_comment_policy.yaml
      - sub_harnesses/prototype_projection_harness/drd/examples/jsonc/commented_payload_example.jsonc
    machine_rule:
      check_type: lang_001
      pass_when:
      - 严格 JSON 文件不得包含 // 或 /* */ 注释；需要中文注释时使用 YAML 或 JSONC 草稿。 is satisfied with
        explicit source-slice, packet, annotation, pen-line, review-log, or DRD projection
        evidence.
      fail_when:
      - 严格 JSON 文件不得包含 // 或 /* */ 注释；需要中文注释时使用 YAML 或 JSONC 草稿。 is missing, contradicted,
        or used to create/overwrite PRD facts without owner review.
    human_review:
      reviewer_prompt: 确认 LANG-001：严格 JSON 文件不得包含 // 或 /* */ 注释；需要中文注释时使用 YAML 或 JSONC
        草稿。 是否由 v3.0 DRD stage 证据支撑，且没有把 runtime、Figma、annotation 或 Pen line 当成 PRD
        事实源？
      evidence:
      - source_slices
      - materialization_manifest
      - board_packets
      - annotation_packets
      - pen_line_packets
      - projection_report
      - review_log
  - id: LANG-002
    stage: language
    severity: warning
    natural_language: 机器字段名必须使用稳定英文 key，中文说明进入 *_zh / description_zh / copy.zh-CN。
    applies_to:
      documents: *id001
    machine_rule:
      check_type: lang_002
      pass_when:
      - 机器字段名必须使用稳定英文 key，中文说明进入 *_zh / description_zh / copy.zh-CN。 is satisfied
        with explicit source-slice, packet, annotation, pen-line, review-log, or DRD
        projection evidence.
      fail_when:
      - 机器字段名必须使用稳定英文 key，中文说明进入 *_zh / description_zh / copy.zh-CN。 is missing, contradicted,
        or used to create/overwrite PRD facts without owner review.
    human_review:
      reviewer_prompt: 确认 LANG-002：机器字段名必须使用稳定英文 key，中文说明进入 *_zh / description_zh
        / copy.zh-CN。 是否由 v3.0 DRD stage 证据支撑，且没有把 runtime、Figma、annotation 或 Pen
        line 当成 PRD 事实源？
      evidence:
      - source_slices
      - materialization_manifest
      - board_packets
      - annotation_packets
      - pen_line_packets
      - projection_report
      - review_log
  payload_sharding_validators:
  - id: SHARD-001
    stage: payload_sharding
    severity: blocker
    natural_language: 不得生成单体大 payload；必须使用 manifest + libs + board/page shards。
    applies_to:
      documents: &id002
