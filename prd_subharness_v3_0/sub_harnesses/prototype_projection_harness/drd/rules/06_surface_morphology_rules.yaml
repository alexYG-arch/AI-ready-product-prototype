surface_morphology_rules:
  id: SURF-MORPH-001
  id_zh: 宿主表面形态规则
  version: "3.0"

  purpose_zh: 在选定 host surface 后，判断 UI 是展开、折叠、替换区域、锚定、外部交接还是临时反馈。

  morphology_operators:
    - operator: navigate
      operator_zh: 页面导航
      allowed_surfaces: [app_page]
    - operator: open_overlay
      operator_zh: 打开覆盖层
      allowed_surfaces: [dialog_modal, anchored_popover, transient_feedback]
    - operator: show_temporarily
      operator_zh: 短暂显示
      allowed_surfaces: [transient_feedback, notification_surface]
    - operator: expand_from_anchor
      operator_zh: 从锚点展开
      allowed_surfaces: [attached_panel, embedded_widget, assistant_panel]
    - operator: collapse_to_anchor
      operator_zh: 折叠回锚点
      allowed_surfaces: [attached_panel, embedded_widget, assistant_panel]
    - operator: replace_region_content
      operator_zh: 替换区域内容
      allowed_surfaces: [attached_panel, embedded_widget, assistant_panel, app_page]
    - operator: handoff_to_system
      operator_zh: 交接到系统能力
      allowed_surfaces: [system_handoff]
    - operator: return_with_result
      operator_zh: 带结果返回
      allowed_surfaces: [system_handoff]

  morphology_decision_required_fields:
    - decision_id
    - host_surface_ref
    - selected_operator
    - source_region
    - target_region
    - persistence
    - blocking
    - rationale_zh
    - source_refs

  persistence_values:
    - persistent
    - transient_auto_dismiss
    - user_dismissed
    - system_dismissed
    - until_task_complete

  blocking_values:
    - blocking
    - non_blocking
    - semi_blocking

  forbidden:
    - operator_not_allowed_for_surface
    - missing_collapse_path_for_persistent_attached_panel
    - modal_without_blocking_reason
    - transient_feedback_without_dismiss_strategy
