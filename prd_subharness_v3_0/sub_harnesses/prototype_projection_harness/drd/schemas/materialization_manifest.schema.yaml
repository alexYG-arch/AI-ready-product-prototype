meta_schema_note: "Lightweight YAML schema for Codex and validator hints, not full JSON Schema."
meta_schema_note_zh: "轻量 YAML schema，用于 Codex 和 validator 提示，不是完整 JSON Schema。"

required: [run_id, libraries, boards, flows, execution]
properties:
  run_id: string
  libraries: map[path]
  boards: list[board_ref]
  flows: list[flow_ref]
  execution: object
