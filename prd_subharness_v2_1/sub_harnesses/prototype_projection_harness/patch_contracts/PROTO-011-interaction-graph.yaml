patch_contract:
  schema_version: "2.1"
  id: "PROTO-011"
  name: "Interaction Graph and Figma Reaction Map Consistency"
  owner: "prototype_projection_harness"
  input_documents:
    - "product-spec/prototype.runtime.json"
    - "product-spec/figma-interaction-map.yaml"
  output_documents:
    - "prd_orchestrator/prototype_projection_reports/PROTO-011-*.yaml"
  required_checks:
    - "Every runtime edge has figma_interaction_map entry or explicit projection_gap."
    - "Every reaction map entry resolves to runtime edge_id and interaction_id."
    - "No duplicate source_node_id + trigger without conditional/merge resolution."
    - "Modal and toast lifecycle edges are present."
    - "Analytics events referenced by edges exist or are explicitly none."
  blocks_on_fail: true
