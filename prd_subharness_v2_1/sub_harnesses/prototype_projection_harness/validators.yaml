validator_spec_version: '2.1'
validator_group_spec: prototype_stage_grouped
review_status: approved_by_human_review
intent: 把结构化 PRD facts 安全投射为 two-pass prototype runtime、renderer stage plan、Figma
  reactions/comments/visual lines，并把 Figma diff 回流为 candidate；不得把原型或 Figma 当成事实源。
validators:
  runtime_validators:
  - id: PROTO-RUNTIME-001
    stage: runtime_generation
    severity: blocker
    natural_language: Runtime is generated from allowed sources only
    applies_to:
      documents: &id001
      - product-spec/prototype.runtime.base.json
      - product-spec/prototype.runtime.json
      - sub_harnesses/prototype_projection_harness/runtime_generation_rules.yaml
      - sub_harnesses/prototype_projection_harness/runtime_inference_policy.yaml
      - sub_harnesses/prototype_projection_harness/prototype_runtime_profile.yaml
    machine_rule:
      check_type: proto_runtime_001
      pass_when:
      - Runtime is generated from allowed sources only is satisfied with explicit
        source, lineage, review, or projection evidence.
      fail_when:
      - Runtime is generated from allowed sources only is missing, contradicted, or
        used to create/overwrite PRD facts without owner review.
    human_review:
      reviewer_prompt: 确认 PROTO-RUNTIME-001：Runtime is generated from allowed sources
        only 是否已由 2.1 原型 stage 证据支撑，且没有把原型/Figma 当成事实源？
      evidence: &id002
      - generation_lineage
      - reasoning_completion
      - source_refs
      - prototype_gaps
  - id: PROTO-RUNTIME-002
    stage: runtime_generation
    severity: blocker
    natural_language: Base runtime and completed runtime lineage are present
    applies_to:
      documents: *id001
    machine_rule:
      check_type: proto_runtime_002
      pass_when:
      - Base runtime and completed runtime lineage are present is satisfied with explicit
        source, lineage, review, or projection evidence.
      fail_when:
      - Base runtime and completed runtime lineage are present is missing, contradicted,
        or used to create/overwrite PRD facts without owner review.
    human_review:
      reviewer_prompt: 确认 PROTO-RUNTIME-002：Base runtime and completed runtime lineage
        are present 是否已由 2.1 原型 stage 证据支撑，且没有把原型/Figma 当成事实源？
      evidence: *id002
  - id: PROTO-RUNTIME-003
    stage: runtime_generation
    severity: blocker
    natural_language: Every inferred state or interaction has inference_basis, confidence
      and source_refs
    applies_to:
      documents: *id001
    machine_rule:
      check_type: proto_runtime_003
