  component_validators:
  - id: PROTO-COMP-001
    stage: component_binding
    severity: blocker
    natural_language: Semantic component 必须解析到 Figma component、pattern、semantic library
      composition 或明确 gap。
    applies_to:
      documents:
      - product-spec/component-binding-map.yaml
      - product-spec/design-semantic-library.json
      - sub_harnesses/prototype_projection_harness/component_binding_policy.yaml
    machine_rule:
      check_type: component_binding_resolution
      pass_when:
      - Every semantic component resolves through the configured priority order or
        records a binding gap.
      fail_when:
      - A required semantic component has no binding and no gap.
      - Projection silently downgrades to placeholder without recording gap.
    human_review:
      reviewer_prompt: 组件绑定是来自真实设计系统、pattern、语义库 fallback，还是需要补 gap？
      evidence:
      - component-binding-map.yaml
      - component_binding_policy.priority_order
  - id: PROTO-COMP-002
    stage: component_binding
    severity: minor
    natural_language: Variant mapping 应覆盖 runtime 需要的状态；缺 variant 时必须生成 review_required
      gap。
    applies_to:
      documents:
      - product-spec/component-binding-map.yaml
      - sub_harnesses/prototype_projection_harness/component_binding_policy.yaml
    machine_rule:
      check_type: component_variant_coverage
      pass_when:
      - Required runtime states map to component variants or explicit gaps.
      fail_when:
      - Runtime requires a disabled/loading/error state but variant mapping is absent
        and no gap exists.
    human_review:
      reviewer_prompt: 设计系统组件 variant 是否覆盖原型需要的状态？
      evidence:
      - variant_rules
      - component binding gaps
  - id: PROTO-COMP-003
    stage: component_binding
    severity: blocker
    natural_language: 组件角色变化、button/link 替换、主次 intent 变化等语义性替换必须成为 candidate，不能直接改事实。
    applies_to:
      documents:
      - product-spec/component-binding-map.yaml
      - prd_orchestrator/change_patch_candidates/
    machine_rule:
      check_type: semantic_component_replacement_gate
      pass_when:
      - Role-changing replacements generate semantic candidates and human review requirements.
      fail_when:
      - A role-changing component replacement is accepted as visual-only.
      - A component change directly writes requirements, screens, metrics, events,
        or PRD.
    human_review:
      reviewer_prompt: 这个组件替换是否改变了用户行为、语义角色或需求事实？
      evidence:
      - component_binding_policy.prop_override_rules
      - change_patch_candidates
  figma_sync_validators:
  - id: PROTO-FIGMA-001
    stage: figma_forward_projection
    severity: blocker
    natural_language: Managed Figma nodes 必须保存 semantic_id、runtime_hash、source_refs
      等 metadata。
    applies_to:
      documents:
      - product-spec/figma-sync-map.yaml
      - sub_harnesses/prototype_projection_harness/figma_projection_rules.yaml
    machine_rule:
      check_type: figma_node_metadata_required
      pass_when:
      - Managed nodes include semantic_id, semantic_type, runtime_hash, source_refs,
        managed_by, and override_policy.
      fail_when:
      - A managed node lacks required metadata.
      - Full runtime payload is stored on Figma node instead of ids/hashes/refs.
    human_review:
      reviewer_prompt: Figma node metadata 是否足以支持 diff、patch 和回链？
      evidence:
      - figma-sync-map.yaml
      - figma_projection_rules.node_metadata
  - id: PROTO-FIGMA-002
    stage: figma_forward_projection
    severity: blocker
    natural_language: 默认不能 full rebuild designer-owned zones；应按 semantic_id patch
      managed zones 并保留设计师视觉覆盖。
    applies_to:
      documents:
      - product-spec/figma-sync-map.yaml
      - sub_harnesses/prototype_projection_harness/figma_projection_rules.yaml
    machine_rule:
      check_type: figma_patch_preserves_designer_zones
      pass_when:
      - Projection updates managed zones by semantic_id.
      - Designer-owned zones are preserved unless explicit review approves replacement.
      fail_when:
      - Projection plans a full rebuild by default.
      - Designer-owned nodes are overwritten without review.
    human_review:
      reviewer_prompt: 本次投射是否只 patch harness-managed 区域，是否保护了设计师拥有的视觉层？
      evidence:
      - figma_projection_rules.update_policy
      - prototype_projection_plan
  - id: PROTO-FIGMA-003
    stage: reverse_sync
    severity: blocker
    natural_language: Figma diff 不能直接写 fact stores，只能生成 figma_diff_report 和 change_patch_candidate。
    applies_to:
      documents:
      - prd_orchestrator/figma_diff_reports/
      - prd_orchestrator/change_patch_candidates/
      - prd_orchestrator/patch_control_v2.yaml
    machine_rule:
      check_type: figma_diff_no_direct_fact_write
      pass_when:
      - Figma diff outputs are reports and candidates only.
      - Fact store changes route through owner harness review.
      fail_when:
      - Figma diff writes requirements, screens, metrics, events, or PRD directly.
    human_review:
      reviewer_prompt: Figma 修改是否只进入 candidate，而不是直接改事实文件？
      evidence:
      - patch_control_v2.write_policy
      - figma_diff_reports
      - change_patch_candidates
  - id: PROTO-FIGMA-004
    stage: reverse_sync
    severity: blocker
    natural_language: 反向同步生成 semantic candidate 前必须做三向 diff：上次 runtime、当前 Figma semantic
      extract、当前 PRD runtime。
    applies_to:
      documents:
      - prd_orchestrator/figma_diff_reports/
      - prd_orchestrator/patch_control_v2.yaml
      - sub_harnesses/prototype_projection_harness/reverse_sync_policy.yaml
    machine_rule:
      check_type: figma_reverse_sync_three_way_diff
      pass_when:
      - Diff reports include base, Figma extract, and current PRD runtime hashes or
        refs.
      - Same semantic field changed on both sides is classified as conflict.
      fail_when:
      - Semantic candidate is created from Figma diff without three-way evidence.
      - Conflict is auto-applied without review decision.
    human_review:
      reviewer_prompt: 这个 Figma diff 是否已经和上次 runtime、当前 PRD runtime 做过三向比较？冲突是否进入人工决策？
      evidence:
      - figma_diff_reports
      - reverse_sync_policy.three_way_diff
