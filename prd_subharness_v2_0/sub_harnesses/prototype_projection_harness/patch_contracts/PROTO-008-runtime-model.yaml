patch_contract:
  schema_version: "2.0"
  id: "PROTO-008"
  name: "Prototype Runtime Model Generation"
  owner: "prototype_projection_harness"
  input_documents:
    - "product-spec/requirements.yaml"
    - "product-spec/screens.yaml"
    - "product-spec/metrics.yaml"
    - "product-spec/events.yaml"
    - "product-spec/traceability.md"
    - "product-spec/component-binding-map.yaml"
    - "product-spec/design-semantic-library.json"
  output_documents:
    - "product-spec/prototype.runtime.json"
    - "prd_orchestrator/prototype_projection_reports/PROTO-008-*.yaml"
  forbidden_inputs_as_fact_source:
    - "product-spec/PRD.md"
    - "Figma frame text"
  validators:
    - "PROTO-RUNTIME-001"
    - "PROTO-RUNTIME-002"
    - "PROTO-RUNTIME-003"
    - "PROTO-RUNTIME-004"
    - "PROTO-RUNTIME-005"
  human_review_required_when:
    - "prototype_gaps contains blocker"
    - "runtime deletes a previously projected semantic object"
