validator_spec_version: "2.0"
validator_group_spec: "prototype_stage_grouped"
review_status: "approved_by_human_review"
intent: "把结构化 PRD facts 安全投射为 prototype.runtime.json、Figma frame/reaction/map，并把 Figma diff 回流为 candidate；不得把原型或 Figma 当成事实源。"

validators:
  runtime_validators:
    - id: "PROTO-RUNTIME-001"
      stage: "runtime_generation"
      severity: "blocker"
      natural_language: "Runtime 只能从允许的结构化事实和受控 design adapter 生成，不能从 PRD.md、Figma 文案或 layer name 反推事实。"
      applies_to:
        documents:
          - "product-spec/prototype.runtime.json"
          - "sub_harnesses/prototype_projection_harness/runtime_generation_rules.yaml"
      machine_rule:
        check_type: "prototype_runtime_source_boundary"
        pass_when:
          - "runtime authority is owned by prototype_projection_harness and forbidden_as_fact_source is true."
          - "source_snapshot and source_refs point only to allowed structured sources or controlled binding files."
        fail_when:
          - "Runtime cites PRD.md, Figma frame text, Figma layer name, Flow Map, or Interaction Spec as fact source."
          - "Runtime contains confirmed semantics with no source_refs."
      human_review:
        reviewer_prompt: "Runtime 中每个语义对象是否都来自结构化事实或受控 binding，而不是从原型文本反推？"
        evidence:
          - "prototype.runtime.json authority/source_snapshot"
          - "runtime_generation_rules.allowed_source_documents"
          - "source_refs"

    - id: "PROTO-RUNTIME-002"
      stage: "runtime_generation"
      severity: "blocker"
      natural_language: "每个 screen state 必须覆盖 required state dimensions，缺失维度必须阻断或写明 not_applicable reason。"
      applies_to:
        documents:
          - "product-spec/prototype.runtime.json"
          - "sub_harnesses/prototype_projection_harness/prototype_runtime_profile.yaml"
      machine_rule:
        check_type: "prototype_runtime_state_dimensions"
        pass_when:
          - "Every screen state includes data, network, permission, input, request lifecycle, consistency, recovery, and platform/device dimensions."
          - "Non-applicable dimensions are explicitly marked with reason."
        fail_when:
          - "A screen state is missing a required dimension."
          - "A missing dimension is silently inferred or omitted."
      human_review:
        reviewer_prompt: "页面状态维度是否完整，缺失项是否真的不适用？"
        evidence:
          - "screens[].states[].dimensions"
          - "prototype_runtime_profile.required_state_dimensions"

    - id: "PROTO-RUNTIME-003"
      stage: "runtime_generation"
      severity: "blocker"
      natural_language: "Runtime 对象必须使用稳定 semantic id，Figma node id 不能作为业务语义 id。"
      applies_to:
        documents:
          - "product-spec/prototype.runtime.json"
          - "sub_harnesses/prototype_projection_harness/prototype_runtime_profile.yaml"
      machine_rule:
        check_type: "stable_semantic_id_required"
        pass_when:
          - "Runtime object ids use stable prefixes such as FLOW, SCREEN, ST, CMP, INT, EDGE, OVERLAY, VAR, or PGAP."
          - "Same input produces the same semantic ids."
        fail_when:
          - "A Figma node id is used as semantic id."
          - "Runtime contains random or unstable ids for semantic objects."
      human_review:
        reviewer_prompt: "这些 id 是否能跨 Figma 重建和重新投射保持稳定？"
        evidence:
          - "prototype.runtime.json ids"
          - "prototype_runtime_profile.object_types"

    - id: "PROTO-RUNTIME-004"
      stage: "runtime_generation"
      severity: "blocker"
      natural_language: "每个 runtime semantic object 都必须有 source_refs；缺来源不能成为 confirmed projection。"
      applies_to:
        documents:
          - "product-spec/prototype.runtime.json"
      machine_rule:
        check_type: "runtime_object_source_refs"
        pass_when:
          - "Screens, states, components, interactions, edges, overlays, and gaps include source_refs when semantic."
        fail_when:
          - "A semantic runtime object lacks source_refs."
          - "Generated copy or interaction is treated as confirmed without review evidence."
      human_review:
        reviewer_prompt: "抽查 runtime 对象，是否都能回链到需求、页面、指标、事件、追踪或 binding 配置？"
        evidence:
          - "prototype.runtime.json source_refs"

    - id: "PROTO-RUNTIME-005"
      stage: "runtime_generation"
      severity: "major"
      natural_language: "缺失语义、目标、组件绑定或恢复路径必须进入 prototype_gaps，不能被原型 harness 脑补。"
      applies_to:
        documents:
          - "product-spec/prototype.runtime.json"
          - "prd_orchestrator/prototype_projection_reports/"
      machine_rule:
        check_type: "prototype_gap_capture"
        pass_when:
          - "Missing destination, component binding, analytics event, or recovery path is represented as prototype_gaps."
          - "Blocker gaps block affected runtime edge or frame projection."
        fail_when:
          - "Missing semantics are silently converted into generated behavior."
          - "A blocker gap exists while affected projection proceeds as if valid."
      human_review:
        reviewer_prompt: "哪些原型 gap 会阻断 runtime 或 Figma 投射？是否已经显式交给 owner harness 或人工 review？"
        evidence:
          - "prototype_gaps"
          - "prototype_projection_reports"

  interaction_validators:
    - id: "PROTO-INTERACTION-001"
      stage: "figma_forward_projection"
      severity: "blocker"
      natural_language: "每个 runtime interaction 都必须能解析到 Figma source node、hotspot、frame region 或明确 projection gap。"
      applies_to:
        documents:
          - "product-spec/prototype.runtime.json"
          - "product-spec/figma-interaction-map.yaml"
          - "sub_harnesses/prototype_projection_harness/interaction_projection_rules.yaml"
      machine_rule:
        check_type: "interaction_source_resolution"
        pass_when:
          - "Each edge has a source resolution strategy and source_refs."
          - "Missing sources block edge projection."
        fail_when:
          - "An interaction has no source node strategy."
          - "A generated documentation arrow is treated as the real source reaction."
      human_review:
        reviewer_prompt: "每条交互的真实触发节点或 hotspot 是否明确？"
        evidence:
          - "interaction_graph.edges"
          - "figma_interaction_map.interactions[].figma_source"

    - id: "PROTO-INTERACTION-002"
      stage: "figma_forward_projection"
      severity: "blocker"
      natural_language: "navigate、open_overlay、change_to 等动作必须能解析到 destination frame、overlay 或 variant。"
      applies_to:
        documents:
          - "product-spec/prototype.runtime.json"
          - "product-spec/figma-sync-map.yaml"
          - "product-spec/figma-interaction-map.yaml"
      machine_rule:
        check_type: "interaction_destination_resolution"
        pass_when:
          - "Navigation and overlay actions resolve to managed Figma node ids."
          - "Missing destinations block affected edge projection."
        fail_when:
          - "A reaction action has no destination."
          - "A missing variant or overlay is silently ignored."
      human_review:
        reviewer_prompt: "跳转、浮层、变体变化是否都有真实目标？"
        evidence:
          - "figma-sync-map.yaml"
          - "figma-interaction-map.yaml"

    - id: "PROTO-INTERACTION-003"
      stage: "figma_forward_projection"
      severity: "blocker"
      natural_language: "同一 source node + trigger 不能重复绑定多条 reaction，除非合并为多动作或 conditional。"
      applies_to:
        documents:
          - "product-spec/figma-interaction-map.yaml"
          - "sub_harnesses/prototype_projection_harness/figma_reaction_mapping.yaml"
      machine_rule:
        check_type: "duplicate_reaction_conflict"
        pass_when:
          - "Same-source same-trigger reactions are unique or explicitly merged/conditional."
        fail_when:
          - "Two reactions share the same source_node_id and trigger without resolution."
      human_review:
        reviewer_prompt: "是否有同一个点击区域触发多个互相冲突的动作？"
        evidence:
          - "figma_interaction_map.interactions"
          - "figma_reaction_mapping.conflict_rules"

    - id: "PROTO-INTERACTION-004"
      stage: "interaction_graph_consistency"
      severity: "blocker"
      natural_language: "每条 edge 必须有 interaction_id 和 source_refs，并能回链到 runtime interaction graph。"
      applies_to:
        documents:
          - "product-spec/prototype.runtime.json"
          - "product-spec/figma-interaction-map.yaml"
      machine_rule:
        check_type: "interaction_edge_traceability"
        pass_when:
          - "Every Figma reaction map entry resolves to runtime edge_id and interaction_id."
          - "Every runtime edge has source_refs."
        fail_when:
          - "A reaction map entry references a missing edge_id."
          - "A runtime edge lacks interaction_id or source_refs."
      human_review:
        reviewer_prompt: "Figma reaction 和 runtime edge 是否一一可追踪？"
        evidence:
          - "interaction_graph.edges"
          - "figma-interaction-map.yaml"

    - id: "PROTO-INTERACTION-005"
      stage: "figma_forward_projection"
      severity: "blocker"
      natural_language: "阻塞型 modal 必须有 close/cancel path，破坏性确认必须同时有取消与确认路径。"
      applies_to:
        documents:
          - "product-spec/prototype.runtime.json"
          - "sub_harnesses/prototype_projection_harness/interaction_projection_rules.yaml"
      machine_rule:
        check_type: "blocking_modal_lifecycle"
        pass_when:
          - "Blocking modal overlays include close or cancel interactions."
          - "Destructive modal flows include both cancel and confirm paths."
        fail_when:
          - "A blocking modal has no escape path."
          - "Destructive confirmation lacks cancel path."
      human_review:
        reviewer_prompt: "用户进入阻塞弹窗后是否一定能取消、关闭或恢复？"
        evidence:
          - "overlays"
          - "interaction_graph.edges"

    - id: "PROTO-INTERACTION-006"
      stage: "figma_forward_projection"
      severity: "major"
      natural_language: "Toast 必须有 dismiss strategy，自动消失时间或显式关闭规则不能缺失。"
      applies_to:
        documents:
          - "product-spec/prototype.runtime.json"
          - "sub_harnesses/prototype_projection_harness/interaction_projection_rules.yaml"
      machine_rule:
        check_type: "toast_dismiss_strategy"
        pass_when:
          - "Every toast overlay is non-blocking and has auto dismiss or explicit dismiss behavior."
        fail_when:
          - "A toast has no dismiss strategy."
      human_review:
        reviewer_prompt: "Toast 是否会自动消失或有明确关闭策略？"
        evidence:
          - "overlays"
          - "overlay_policy.toast"

    - id: "PROTO-INTERACTION-007"
      stage: "documentation_projection"
      severity: "minor"
      natural_language: "每个 semantic interaction 都应出现在 Interaction Spec 页面；说明卡只解释交互，不能替代真实 reaction。"
      applies_to:
        documents:
          - "product-spec/figma-interaction-map.yaml"
          - "prd_orchestrator/prototype_projection_reports/"
      machine_rule:
        check_type: "interaction_spec_coverage"
        pass_when:
          - "Interaction Spec contains cards for semantic interactions or records an explicit documentation gap."
        fail_when:
          - "A semantic interaction is omitted from documentation with no gap."
      human_review:
        reviewer_prompt: "评审者是否能在 Interaction Spec 中读到每条交互的 trigger、guard、action、event 和来源？"
        evidence:
          - "prototype_projection_reports"
          - "interaction spec coverage"

    - id: "PROTO-INTERACTION-008"
      stage: "interaction_graph_consistency"
      severity: "blocker"
      natural_language: "Figma reaction map round trip 必须和 runtime interaction graph 一致，不能凭 Figma 连线创建事实。"
      applies_to:
        documents:
          - "product-spec/prototype.runtime.json"
          - "product-spec/figma-interaction-map.yaml"
      machine_rule:
        check_type: "reaction_runtime_round_trip"
        pass_when:
          - "Every reaction map entry resolves to a runtime edge and every projected runtime edge has map entry or explicit gap."
        fail_when:
          - "A Figma reaction exists as semantic behavior without matching runtime edge."
          - "A runtime edge disappeared from reaction map without gap."
      human_review:
        reviewer_prompt: "Figma 中真实可点击连线是否全部来自 runtime edge？"
        evidence:
          - "figma-interaction-map.yaml"
          - "interaction_graph.edges"

  component_validators:
    - id: "PROTO-COMP-001"
      stage: "component_binding"
      severity: "blocker"
      natural_language: "Semantic component 必须解析到 Figma component、pattern、semantic library composition 或明确 gap。"
      applies_to:
        documents:
          - "product-spec/component-binding-map.yaml"
          - "product-spec/design-semantic-library.json"
          - "sub_harnesses/prototype_projection_harness/component_binding_policy.yaml"
      machine_rule:
        check_type: "component_binding_resolution"
        pass_when:
          - "Every semantic component resolves through the configured priority order or records a binding gap."
        fail_when:
          - "A required semantic component has no binding and no gap."
          - "Projection silently downgrades to placeholder without recording gap."
      human_review:
        reviewer_prompt: "组件绑定是来自真实设计系统、pattern、语义库 fallback，还是需要补 gap？"
        evidence:
          - "component-binding-map.yaml"
          - "component_binding_policy.priority_order"

    - id: "PROTO-COMP-002"
      stage: "component_binding"
      severity: "minor"
      natural_language: "Variant mapping 应覆盖 runtime 需要的状态；缺 variant 时必须生成 review_required gap。"
      applies_to:
        documents:
          - "product-spec/component-binding-map.yaml"
          - "sub_harnesses/prototype_projection_harness/component_binding_policy.yaml"
      machine_rule:
        check_type: "component_variant_coverage"
        pass_when:
          - "Required runtime states map to component variants or explicit gaps."
        fail_when:
          - "Runtime requires a disabled/loading/error state but variant mapping is absent and no gap exists."
      human_review:
        reviewer_prompt: "设计系统组件 variant 是否覆盖原型需要的状态？"
        evidence:
          - "variant_rules"
          - "component binding gaps"

    - id: "PROTO-COMP-003"
      stage: "component_binding"
      severity: "blocker"
      natural_language: "组件角色变化、button/link 替换、主次 intent 变化等语义性替换必须成为 candidate，不能直接改事实。"
      applies_to:
        documents:
          - "product-spec/component-binding-map.yaml"
          - "prd_orchestrator/change_patch_candidates/"
      machine_rule:
        check_type: "semantic_component_replacement_gate"
        pass_when:
          - "Role-changing replacements generate semantic candidates and human review requirements."
        fail_when:
          - "A role-changing component replacement is accepted as visual-only."
          - "A component change directly writes requirements, screens, metrics, events, or PRD."
      human_review:
        reviewer_prompt: "这个组件替换是否改变了用户行为、语义角色或需求事实？"
        evidence:
          - "component_binding_policy.prop_override_rules"
          - "change_patch_candidates"

  figma_sync_validators:
    - id: "PROTO-FIGMA-001"
      stage: "figma_forward_projection"
      severity: "blocker"
      natural_language: "Managed Figma nodes 必须保存 semantic_id、runtime_hash、source_refs 等 metadata。"
      applies_to:
        documents:
          - "product-spec/figma-sync-map.yaml"
          - "sub_harnesses/prototype_projection_harness/figma_projection_rules.yaml"
      machine_rule:
        check_type: "figma_node_metadata_required"
        pass_when:
          - "Managed nodes include semantic_id, semantic_type, runtime_hash, source_refs, managed_by, and override_policy."
        fail_when:
          - "A managed node lacks required metadata."
          - "Full runtime payload is stored on Figma node instead of ids/hashes/refs."
      human_review:
        reviewer_prompt: "Figma node metadata 是否足以支持 diff、patch 和回链？"
        evidence:
          - "figma-sync-map.yaml"
          - "figma_projection_rules.node_metadata"

    - id: "PROTO-FIGMA-002"
      stage: "figma_forward_projection"
      severity: "blocker"
      natural_language: "默认不能 full rebuild designer-owned zones；应按 semantic_id patch managed zones 并保留设计师视觉覆盖。"
      applies_to:
        documents:
          - "product-spec/figma-sync-map.yaml"
          - "sub_harnesses/prototype_projection_harness/figma_projection_rules.yaml"
      machine_rule:
        check_type: "figma_patch_preserves_designer_zones"
        pass_when:
          - "Projection updates managed zones by semantic_id."
          - "Designer-owned zones are preserved unless explicit review approves replacement."
        fail_when:
          - "Projection plans a full rebuild by default."
          - "Designer-owned nodes are overwritten without review."
      human_review:
        reviewer_prompt: "本次投射是否只 patch harness-managed 区域，是否保护了设计师拥有的视觉层？"
        evidence:
          - "figma_projection_rules.update_policy"
          - "prototype_projection_plan"

    - id: "PROTO-FIGMA-003"
      stage: "reverse_sync"
      severity: "blocker"
      natural_language: "Figma diff 不能直接写 fact stores，只能生成 figma_diff_report 和 change_patch_candidate。"
      applies_to:
        documents:
          - "prd_orchestrator/figma_diff_reports/"
          - "prd_orchestrator/change_patch_candidates/"
          - "prd_orchestrator/patch_control_v2.yaml"
      machine_rule:
        check_type: "figma_diff_no_direct_fact_write"
        pass_when:
          - "Figma diff outputs are reports and candidates only."
          - "Fact store changes route through owner harness review."
        fail_when:
          - "Figma diff writes requirements, screens, metrics, events, or PRD directly."
      human_review:
        reviewer_prompt: "Figma 修改是否只进入 candidate，而不是直接改事实文件？"
        evidence:
          - "patch_control_v2.write_policy"
          - "figma_diff_reports"
          - "change_patch_candidates"

    - id: "PROTO-FIGMA-004"
      stage: "reverse_sync"
      severity: "blocker"
      natural_language: "反向同步生成 semantic candidate 前必须做三向 diff：上次 runtime、当前 Figma semantic extract、当前 PRD runtime。"
      applies_to:
        documents:
          - "prd_orchestrator/figma_diff_reports/"
          - "prd_orchestrator/patch_control_v2.yaml"
          - "sub_harnesses/prototype_projection_harness/reverse_sync_policy.yaml"
      machine_rule:
        check_type: "figma_reverse_sync_three_way_diff"
        pass_when:
          - "Diff reports include base, Figma extract, and current PRD runtime hashes or refs."
          - "Same semantic field changed on both sides is classified as conflict."
        fail_when:
          - "Semantic candidate is created from Figma diff without three-way evidence."
          - "Conflict is auto-applied without review decision."
      human_review:
        reviewer_prompt: "这个 Figma diff 是否已经和上次 runtime、当前 PRD runtime 做过三向比较？冲突是否进入人工决策？"
        evidence:
          - "figma_diff_reports"
          - "reverse_sync_policy.three_way_diff"
