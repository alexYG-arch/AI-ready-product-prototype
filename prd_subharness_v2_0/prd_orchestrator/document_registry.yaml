document_registry:
  version: "2.0"
  documents:
    - document_id: "DOC-STRUCTURED-SOURCE-BASELINE"
      path: "runs/<run-id>/prd_orchestrator/source_extraction/structured_source_baseline.yaml"
      doc_type: "source_prd_structured_extraction_baseline"
      authority_role: "reviewed_source_input_baseline"
      writable_by:
        - "prd_orchestrator"
      fact_promotion_requires_review_decision: true
      consumed_by:
        - "prd_core_harness"
        - "requirement_harness"
        - "screen_state_harness"
        - "metrics_events_harness"
        - "release_ops_harness"
        - "traceability_harness"
        - "projection_sync_harness"
        - "prototype_projection_harness"

    - document_id: "DOC-STRUCTURED-SOURCE-SLICES"
      path: "runs/<run-id>/prd_orchestrator/source_extraction/sub_harness_inputs/*.yaml"
      doc_type: "source_prd_sub_harness_input_slice"
      authority_role: "reviewed_source_input_slice"
      writable_by:
        - "prd_orchestrator"
      fact_promotion_requires_review_decision: true
      consumed_by:
        - "target_sub_harness"

    - document_id: "DOC-PRD"
      path: "product-spec/PRD.md"
      doc_type: "narrative_prd_projection"
      authority_role: "human_readable_projection"
      writable_by:
        - "projection_sync_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-REQ"
      path: "product-spec/requirements.yaml"
      doc_type: "requirements_fact_store"
      authority_role: "structured_requirement_fact_store"
      writable_by:
        - "requirement_harness"

    - document_id: "DOC-SCREENS"
      path: "product-spec/screens.yaml"
      doc_type: "screen_semantic_model"
      authority_role: "screen_fact_store"
      writable_by:
        - "screen_state_harness"

    - document_id: "DOC-METRICS"
      path: "product-spec/metrics.yaml"
      doc_type: "metric_model"
      authority_role: "metric_fact_store"
      writable_by:
        - "metrics_events_harness"

    - document_id: "DOC-EVENTS"
      path: "product-spec/events.yaml"
      doc_type: "event_model"
      authority_role: "event_fact_store"
      writable_by:
        - "metrics_events_harness"

    - document_id: "DOC-TRACE"
      path: "product-spec/traceability.md"
      doc_type: "traceability_projection"
      authority_role: "traceability_index"
      writable_by:
        - "traceability_harness"

    - document_id: "DOC-TECH"
      path: "product-spec/tech-design.md"
      doc_type: "tech_design_projection"
      authority_role: "engineering_projection"
      forbidden_as_fact_source: true

    - document_id: "DOC-TEST"
      path: "product-spec/test-plan.md"
      doc_type: "test_plan_projection"
      authority_role: "qa_projection"
      forbidden_as_fact_source: true

    - document_id: "DOC-ANALYTICS"
      path: "product-spec/analytics-spec.md"
      doc_type: "analytics_projection"
      authority_role: "analytics_projection"
      forbidden_as_fact_source: true

    - document_id: "DOC-RELEASE"
      path: "product-spec/release-plan.md"
      doc_type: "release_projection"
      authority_role: "release_projection"
      writable_by:
        - "release_ops_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-PROTO-RUNTIME"
      path: "product-spec/prototype.runtime.json"
      doc_type: "interactive_prototype_runtime_model"
      authority_role: "derived_projection_intermediate"
      writable_by:
        - "prototype_projection_harness"
      readable_by:
        - "prototype_projection_harness"
        - "traceability_harness"
      allowed_sources:
        - "product-spec/requirements.yaml"
        - "product-spec/screens.yaml"
        - "product-spec/metrics.yaml"
        - "product-spec/events.yaml"
        - "product-spec/traceability.md"
        - "product-spec/component-binding-map.yaml"
        - "product-spec/design-semantic-library.json"
      forbidden_as_fact_source: true

    - document_id: "DOC-FIGMA-SYNC-MAP"
      path: "product-spec/figma-sync-map.yaml"
      doc_type: "figma_node_binding_map"
      authority_role: "artifact_binding_map"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-FIGMA-INTERACTION-MAP"
      path: "product-spec/figma-interaction-map.yaml"
      doc_type: "figma_reaction_binding_map"
      authority_role: "artifact_binding_map"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-COMPONENT-BINDING-MAP"
      path: "product-spec/component-binding-map.yaml"
      doc_type: "component_semantic_binding_map"
      authority_role: "semantic_adapter_controlled_config"
      writable_by:
        - "prototype_projection_harness"
      human_review_required_for_component_key_changes: true

    - document_id: "DOC-DESIGN-SEMANTIC-LIBRARY"
      path: "product-spec/design-semantic-library.json"
      doc_type: "design_semantic_library"
      authority_role: "semantic_adapter_controlled_config"
      writable_by:
        - "prototype_projection_harness"
      human_review_required_for_role_changes: true

    - document_id: "DOC-FIGMA-DIFF-REPORTS"
      path: "prd_orchestrator/figma_diff_reports"
      doc_type: "figma_diff_report_directory"
      authority_role: "reverse_sync_evidence"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true

    - document_id: "DOC-PROTOTYPE-PROJECTION-REPORTS"
      path: "prd_orchestrator/prototype_projection_reports"
      doc_type: "prototype_projection_report_directory"
      authority_role: "projection_validation_evidence"
      writable_by:
        - "prototype_projection_harness"
      forbidden_as_fact_source: true
