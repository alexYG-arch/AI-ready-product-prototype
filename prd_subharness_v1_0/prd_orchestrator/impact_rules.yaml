        - "traceability_harness"
        - "projection_sync_harness"

    release_ops_harness:
      downstream:
        - "projection_sync_harness"

    prd_core_harness:
      downstream:
        - "requirement_harness"
        - "traceability_harness"
        - "projection_sync_harness"
