harness_registry:
  version: "1.0"
  orchestrator: "prd_orchestrator"

  sub_harnesses:
    - id: "prd_core_harness"
      path: "sub_harnesses/prd_core_harness"
      owns:
        - "prd_core"
        - "goals"
        - "scope"
        - "non_goals"
        - "risks"
        - "open_questions"

    - id: "requirement_harness"
      path: "sub_harnesses/requirement_harness"
      owns:
        - "requirements"
        - "c_ears"
        - "fit_criteria"
        - "acceptance"
        - "verification"
        - "requirement_gaps"

    - id: "screen_state_harness"
      path: "sub_harnesses/screen_state_harness"
      owns:
        - "screens"
        - "states"
        - "state_reasoning_chains"
        - "copy"
        - "accessibility"

    - id: "metrics_events_harness"
      path: "sub_harnesses/metrics_events_harness"
      owns:
        - "metrics"
        - "events"
        - "funnels"
        - "experiments"
        - "instrumentation"

    - id: "release_ops_harness"
      path: "sub_harnesses/release_ops_harness"
      owns:
        - "release_plan"
        - "rollout"
        - "monitoring"
        - "rollback"
        - "ops_readiness"

    - id: "projection_sync_harness"
      path: "sub_harnesses/projection_sync_harness"
      owns:
        - "prd_md_projection"
        - "prd_template_validation"
        - "yaml_to_prd_sync"

    - id: "traceability_harness"
      path: "sub_harnesses/traceability_harness"
      owns:
        - "traceability"
        - "impact_analysis"
        - "partial_rerun_plan"
        - "dependency_graph"
        - "tombstones"
